[project]
name = "on-hold-voice-agent"
version = "0.1.0"
description = "An outbound voice agent on PolyAI's Dialog-RSN-1 that gets through a phone menu, waits on hold in silence and talks to the person who picks up"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Dialog-RSN-1 API (needs POLYAI_LIVE=1 and POLY_API_KEY)"]
